[project]
name = "qpu4qc-toy"
version = "0.1.0"
description = "Toy reference implementation of the qpu4qc pattern: content-addressed, calibrated escalation across classical and quantum levels of theory."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
